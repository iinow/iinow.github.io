  f_version: "Version"
  f_variant: "Variant"
  f_time: "Embedded time (ISO 8601 · UTC)"
  f_local: "Local time"
  f_unix: "Unix milliseconds"
  f_rand: "Random part (rand_a / rand_b)"
  err_bad: "Not a UUID. It has to be 32 hexadecimal digits."
  warn_version: "This is a version {v} UUID. It is not v7, so no timestamp was read."
  bulk_title: "Generate a batch"
  bulk_count: "How many (max 1000)"
  btn_bulk: "Generate batch"
  btn_bulk_copy: "Copy the whole list"
  count: "{n} generated"
  history: "Recently decoded UUIDs"
  history_empty: "No history yet. It fills up automatically when you decode a UUID."
  history_clear: "Clear history"
  history_note: "The last 10 entries are kept only in this browser (localStorage) and never sent to a server. Click one to decode it again."
  about_title: "What is UUID v7?"
  about:
    - "UUID v7 is the time-ordered UUID standardized in RFC 9562. Of its 128 bits, the first 48 hold the Unix time in milliseconds, 4 bits hold the version (7), 2 bits hold the variant, and the remaining 74 bits are random. As a result the values sort in creation order, both as strings and as raw bytes."
    - "A fully random UUID v4 used as a database primary key lands all over a B-tree index, causing page splits and cache misses. A UUID v7 is always appended near the end of the index, so inserts are faster, and the approximate creation time can be read without a separate created_at column."
    - "This generator increments the random part by one for values made within the same millisecond, so their order is preserved. Randomness comes from the browser's crypto.getRandomValues, and every calculation stays in your browser."
  faq_title: "Frequently asked questions"
  faq:
    - q: "What is the difference between UUID v4 and UUID v7?"
      a: "UUID v4 has 122 random bits and no order. UUID v7 starts with a 48-bit millisecond timestamp, so it sorts in creation order, followed by 74 random bits. Where sorting and index performance matter, such as database primary keys, v7 is the better fit."
    - q: "Can the creation time be extracted from a UUID v7?"
      a: "Yes. The first 48 bits are the Unix time in milliseconds and anyone can read them. Paste a UUID into the decoder above to see the time. If the creation time must stay hidden, UUID v4 is the better choice."
    - q: "Can UUID v7 values collide?"
      a: "Two values would need the same millisecond and the same 74 random bits, so the probability is negligible in practice. When generating several values in the same millisecond, this tool increments the random part by one to keep both order and uniqueness."
    - q: "Are the generated UUIDs sent to a server?"
      a: "No. Generating and decoding happen in JavaScript in your browser, and the decode history is kept only in this browser's localStorage."
  related: "More online tools"

