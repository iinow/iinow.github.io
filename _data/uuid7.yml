  history_note: "最近 10 条记录只保存在此浏览器（localStorage）中，不会发送到服务器。点击即可重新解析。"
  about_title: "什么是 UUID v7"
  about:
    - "UUID v7 是 RFC 9562 标准化的按时间排序的 UUID。128 位中，前 48 位存放 Unix 时间（毫秒），4 位是版本号（7），2 位是变体，其余 74 位是随机数。因此无论按字符串还是按字节排序，都与生成顺序一致。"
    - "完全随机的 UUID v4 用作数据库主键时，会散落在 B-Tree 索引的各处，引起页分裂和缓存失效。UUID v7 的新值总是追加在索引末尾附近，插入更快，而且不用另查 created_at 就能知道大致的生成时间。"
    - "本工具在同一毫秒内连续生成时，会把随机部分加 1，以保持顺序。随机数来自浏览器的 crypto.getRandomValues，所有计算都在浏览器内完成。"
  faq_title: "常见问题"
  faq:
    - q: "UUID v4 和 UUID v7 有什么区别？"
      a: "UUID v4 的 122 位全是随机数，没有顺序。UUID v7 的前 48 位是毫秒级时间，因此按生成顺序排列，其余 74 位是随机数。在数据库主键这类看重排序和索引性能的场合，v7 更合适。"
    - q: "能从 UUID v7 中得到生成时间吗？"
      a: "可以。前 48 位就是 Unix 毫秒时间，任何人都能读取。把 UUID 粘贴到上面的解析框里就能看到时间。如果生成时间不能暴露，使用 UUID v4 更稳妥。"
    - q: "UUID v7 会冲突吗？"
      a: "只有在同一毫秒内且 74 位随机数也相同才会冲突，概率在实际使用中可以忽略。本工具在同一毫秒内连续生成时会把随机部分加 1，同时保证顺序和唯一性。"
    - q: "生成的 UUID 会发送到服务器吗？"
      a: "不会。生成和解析都由浏览器中的 JavaScript 完成，解析记录也只保存在此浏览器的 localStorage 中。"
  related: "其他在线工具"
