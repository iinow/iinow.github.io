  about_title: "UUID v7 이란"
  about:
    - "UUID v7 은 RFC 9562 에서 표준이 된 시간순 정렬 UUID 입니다. 128비트 가운데 앞 48비트에 Unix 시각(밀리초)을 넣고, 버전 4비트(7)와 변형 2비트를 뺀 나머지 74비트를 난수로 채웁니다. 그래서 문자열이나 바이트 그대로 정렬해도 만든 순서대로 늘어섭니다."
    - "완전히 무작위인 UUID v4 는 데이터베이스 기본 키로 쓰면 B-Tree 인덱스 곳곳에 흩어져 들어가 페이지 분할과 캐시 손실이 생깁니다. UUID v7 은 새 값이 늘 인덱스 끝쪽에 붙기 때문에 삽입이 빠르고, 따로 created_at 을 보지 않아도 대략의 생성 시각을 알 수 있습니다."
    - "이 생성기는 같은 밀리초 안에서 만든 값도 순서가 유지되도록 난수 부분을 1씩 올립니다. 난수는 브라우저의 crypto.getRandomValues 로 만들고, 모든 계산은 브라우저 안에서만 합니다."
  faq_title: "자주 묻는 질문"
  faq:
    - q: "UUID v4 와 UUID v7 은 무엇이 다른가요?"
      a: "UUID v4 는 122비트가 모두 난수라서 순서가 없습니다. UUID v7 은 앞 48비트가 밀리초 단위 시각이라 만든 순서대로 정렬되고, 나머지 74비트가 난수입니다. 데이터베이스 기본 키처럼 정렬과 인덱스 성능이 중요한 곳에는 v7 이 유리합니다."
    - q: "UUID v7 에서 생성 시각을 알아낼 수 있나요?"
      a: "네. 앞 48비트가 Unix 밀리초 시각이므로 누구나 읽을 수 있습니다. 위의 풀어 보기에 UUID 를 붙여 넣으면 시각이 나옵니다. 생성 시각이 드러나면 안 되는 값이라면 UUID v4 를 쓰는 편이 낫습니다."
    - q: "UUID v7 은 충돌하지 않나요?"
      a: "같은 밀리초 안에서도 74비트 난수가 달라야 하므로 충돌 확률은 사실상 무시할 수 있는 수준입니다. 이 도구는 같은 밀리초에 연달아 만들 때 난수 부분을 1씩 올려 순서와 유일성을 함께 지킵니다."
    - q: "만든 UUID 가 서버로 전송되나요?"
      a: "전송되지 않습니다. 생성과 풀어 보기는 모두 브라우저의 자바스크립트로 처리하고, 풀어 본 이력도 이 브라우저의 localStorage 에만 남습니다."
  related: "다른 온라인 도구"

en:
  nav: "UUID v7 Generator"
  gen_title: "Generate a UUID v7"
  opt_hyphen: "Hyphens"
