  history_note: "このブラウザー（localStorage）にだけ直近 10 件まで保存され、サーバーには送信されません。クリックするともう一度デコードします。"
  about_title: "UUID v7 とは"
  about:
    - "UUID v7 は RFC 9562 で標準化された、時刻順に並ぶ UUID です。128 ビットのうち先頭の 48 ビットに Unix 時刻（ミリ秒）を入れ、バージョンの 4 ビット（7）とバリアントの 2 ビットを除いた残り 74 ビットを乱数で埋めます。そのため、文字列でもバイト列でもそのまま並べ替えるだけで生成順になります。"
    - "完全にランダムな UUID v4 をデータベースの主キーにすると、B-Tree インデックスのあちこちに挿入され、ページ分割やキャッシュミスが発生します。UUID v7 は新しい値が常にインデックスの末尾付近に追加されるので挿入が速く、created_at を見なくてもおおよその生成時刻がわかります。"
    - "このツールは、同じミリ秒の中で作った値も順序が保たれるように乱数部分を 1 ずつ増やします。乱数はブラウザーの crypto.getRandomValues で作り、計算はすべてブラウザー内で行います。"
  faq_title: "よくある質問"
  faq:
    - q: "UUID v4 と UUID v7 の違いは何ですか？"
      a: "UUID v4 は 122 ビットすべてが乱数で、順序がありません。UUID v7 は先頭 48 ビットがミリ秒単位の時刻なので生成順に並び、残りの 74 ビットが乱数です。データベースの主キーのように並び順やインデックス性能が重要な場面では v7 が向いています。"
    - q: "UUID v7 から生成時刻を取り出せますか？"
      a: "はい。先頭 48 ビットは Unix ミリ秒の時刻で、誰でも読み取れます。上のデコード欄に UUID を貼り付けると時刻が表示されます。生成時刻を知られたくない値には UUID v4 を使うほうが安全です。"
    - q: "UUID v7 は衝突しませんか？"
      a: "同じミリ秒で、かつ 74 ビットの乱数まで一致する必要があるため、衝突の確率は実用上無視できます。このツールは同じミリ秒に続けて生成するとき、乱数部分を 1 ずつ増やして順序と一意性の両方を保ちます。"
    - q: "生成した UUID はサーバーに送信されますか？"
      a: "送信されません。生成もデコードもブラウザーの JavaScript で処理し、デコードの履歴もこのブラウザーの localStorage にだけ残ります。"
  related: "ほかのオンラインツール"

