base64:
  ko:
    nav: "Base64 인코딩·디코딩"
    encoded: "Base64"
    plain_ph: "여기에 텍스트를 입력하면 오른쪽에 Base64 가 나옵니다"
    encoded_ph: "여기에 Base64 를 붙여 넣으면 왼쪽에 원문이 나옵니다"
    opt_urlsafe: "URL-safe (+ / 대신 - _, = 패딩 없음)"
    err_decode: "Base64 가 아닙니다. A–Z, a–z, 0–9, +, /, -, _, = 만 쓸 수 있고 길이가 맞아야 합니다."
    warn_utf8: "디코딩은 됐지만 UTF-8 텍스트가 아닙니다. 이미지 같은 바이너리 데이터일 수 있어 깨진 글자로 보입니다."
    sample: "안녕하세요, Base64! 👋"
    about_title: "Base64 인코딩이란"
    about:
      - "Base64 는 임의의 바이트를 A–Z, a–z, 0–9, +, / 64개 글자만으로 적는 방법입니다. 3바이트를 4글자로 바꾸기 때문에 결과가 원본보다 약 33% 길어지고, 길이가 3의 배수가 아니면 끝에 = 를 붙여 맞춥니다."
      - "이메일 첨부(MIME), data URL, HTTP Basic 인증 헤더, JWT, 쿠버네티스 Secret 처럼 텍스트만 지나갈 수 있는 자리에 바이너리나 한글을 실을 때 씁니다. 이 변환기는 텍스트를 UTF-8 바이트로 바꾼 뒤 인코딩하므로 한글·일본어·이모지도 깨지지 않습니다."
      - "모든 변환은 브라우저 안에서만 이루어집니다. 입력한 내용은 서버로 전송되지 않습니다."
    faq:
      - q: "Base64 는 암호화인가요?"
        a: "아닙니다. Base64 는 누구나 되돌릴 수 있는 표기 방식일 뿐 암호화가 아닙니다. 비밀번호나 토큰을 Base64 로 바꿔도 보호되지 않습니다."
      - q: "한글을 Base64 로 인코딩하면 왜 도구마다 결과가 다른가요?"
        a: "글자를 바이트로 바꾸는 문자 인코딩이 다르기 때문입니다. 이 도구는 웹 표준인 UTF-8 을 씁니다. EUC-KR 이나 UTF-16 으로 바꾼 뒤 인코딩한 값과는 결과가 다릅니다."
      - q: "URL-safe Base64(Base64URL)는 무엇이 다른가요?"
        a: "+ 를 - 로, / 를 _ 로 바꾸고 끝의 = 패딩을 뺍니다. URL 이나 파일 이름에 그대로 넣을 수 있어 JWT 등에서 씁니다. 디코딩할 때는 두 방식을 모두 자동으로 받아들입니다."
      - q: "입력한 내용이 서버로 전송되나요?"
        a: "전송되지 않습니다. 인코딩과 디코딩은 모두 브라우저의 자바스크립트로 처리합니다. 최근 이력도 이 브라우저의 localStorage 에만 남으며 언제든 지울 수 있습니다."
  en:
    nav: "Base64 Encode & Decode"
    encoded: "Base64"
    plain_ph: "Type text here and the Base64 appears on the right"
    encoded_ph: "Paste Base64 here and the original text appears on the left"
    opt_urlsafe: "URL-safe (- _ instead of + /, no = padding)"
    err_decode: "Not valid Base64. Only A–Z, a–z, 0–9, +, /, -, _ and = are allowed, and the length has to fit."
    warn_utf8: "Decoded, but the bytes are not UTF-8 text. This may be binary data such as an image, so it shows as broken characters."
    sample: "Hello, Base64! 👋"
    about_title: "What is Base64 encoding?"
    about:
      - "Base64 writes arbitrary bytes using only 64 characters: A–Z, a–z, 0–9, + and /. Every 3 bytes become 4 characters, so the output is about 33% longer than the input, and = is appended as padding when the length is not a multiple of 3."
      - "It is used wherever only text can pass through: email attachments (MIME), data URLs, HTTP Basic auth headers, JWTs and Kubernetes Secrets. This converter turns your text into UTF-8 bytes first, so accented letters, CJK characters and emoji survive the round trip."
      - "Everything runs in your browser. Nothing you type is sent to a server."
    faq:
      - q: "Is Base64 encryption?"
        a: "No. Base64 is a reversible way of writing bytes, not encryption. Anyone can decode it, so encoding a password or token in Base64 does not protect it."
      - q: "Why do different tools give different Base64 for the same non-English text?"
        a: "Because they convert characters to bytes with different character encodings. This tool uses UTF-8, the web standard. Text encoded as UTF-16 or a legacy code page first produces a different result."
      - q: "What is URL-safe Base64 (Base64URL)?"
        a: "It replaces + with - and / with _, and drops the trailing = padding, so the value can go into a URL or file name unchanged. JWTs use it. When decoding, this tool accepts both variants automatically."
      - q: "Is my input sent to a server?"
        a: "No. Encoding and decoding happen in JavaScript in your browser. The recent history is also kept only in this browser's localStorage and can be cleared at any time."
  ja:
    nav: "Base64 エンコード・デコード"
    encoded: "Base64"
    plain_ph: "ここにテキストを入力すると、右側に Base64 が表示されます"
    encoded_ph: "ここに Base64 を貼り付けると、左側に元のテキストが表示されます"
    opt_urlsafe: "URL-safe（+ / の代わりに - _、= パディングなし）"
    err_decode: "Base64 ではありません。使える文字は A–Z、a–z、0–9、+、/、-、_、= だけで、長さも合っている必要があります。"
    warn_utf8: "デコードはできましたが、UTF-8 のテキストではありません。画像などのバイナリデータの可能性があり、文字化けして表示されます。"
    sample: "こんにちは、Base64! 👋"
    about_title: "Base64 エンコードとは"
    about:
      - "Base64 は、任意のバイト列を A–Z、a–z、0–9、+、/ の 64 文字だけで表す方式です。3 バイトを 4 文字に変換するため、結果は元のデータより約 33% 長くなり、長さが 3 の倍数でない場合は末尾に = を付けて揃えます。"
      - "メールの添付ファイル（MIME）、data URL、HTTP Basic 認証ヘッダー、JWT、Kubernetes の Secret など、テキストしか通せない場所でバイナリや日本語を運ぶときに使われます。このツールはテキストを UTF-8 のバイト列に変換してからエンコードするので、日本語や絵文字も文字化けしません。"
      - "変換はすべてブラウザ内で行われます。入力した内容がサーバーに送信されることはありません。"
    faq:
      - q: "Base64 は暗号化ですか？"
        a: "いいえ。Base64 は誰でも元に戻せる表記方法であり、暗号化ではありません。パスワードやトークンを Base64 に変換しても保護にはなりません。"
      - q: "日本語を Base64 にすると、ツールによって結果が違うのはなぜですか？"
        a: "文字をバイト列に変換する文字コードが異なるためです。このツールは Web 標準の UTF-8 を使います。Shift_JIS や UTF-16 に変換してからエンコードした値とは結果が異なります。"
      - q: "URL-safe Base64（Base64URL）は何が違いますか？"
        a: "+ を - に、/ を _ に置き換え、末尾の = パディングを省きます。URL やファイル名にそのまま入れられるため、JWT などで使われます。デコード時はどちらの形式も自動的に受け付けます。"
      - q: "入力した内容はサーバーに送信されますか？"
        a: "送信されません。エンコードもデコードもブラウザの JavaScript で処理します。最近の履歴もこのブラウザーの localStorage にだけ残り、いつでも消去できます。"
  zh:
    nav: "Base64 编码解码"
    encoded: "Base64"
    plain_ph: "在这里输入文本，右侧会显示 Base64"
    encoded_ph: "在这里粘贴 Base64，左侧会显示原始文本"
    opt_urlsafe: "URL 安全（用 - _ 代替 + /，不带 = 填充）"
    err_decode: "不是有效的 Base64。只能包含 A–Z、a–z、0–9、+、/、-、_、=，并且长度要正确。"
    warn_utf8: "已解码，但内容不是 UTF-8 文本。可能是图片等二进制数据，所以显示为乱码。"
    sample: "你好，Base64! 👋"
    about_title: "什么是 Base64 编码"
    about:
      - "Base64 只用 A–Z、a–z、0–9、+、/ 这 64 个字符来表示任意字节。每 3 个字节变成 4 个字符，所以结果比原始数据长约 33%；长度不是 3 的倍数时，会在末尾补 = 。"
      - "它常用于只能传输文本的场合：邮件附件（MIME）、data URL、HTTP Basic 认证头、JWT、Kubernetes Secret 等。本工具先把文本转换为 UTF-8 字节再编码，因此中文和表情符号都不会乱码。"
      - "所有转换都在浏览器内完成，输入的内容不会发送到服务器。"
    faq:
      - q: "Base64 是加密吗？"
        a: "不是。Base64 只是一种任何人都能还原的表示方式，并不是加密。把密码或令牌转成 Base64 并不能保护它们。"
      - q: "为什么中文在不同工具里得到的 Base64 不一样？"
        a: "因为把字符转换成字节时使用的字符编码不同。本工具使用 Web 标准的 UTF-8。先按 GBK 或 UTF-16 转换再编码，得到的结果会不同。"
      - q: "URL 安全的 Base64（Base64URL）有什么不同？"
        a: "它把 + 换成 -，把 / 换成 _，并去掉末尾的 = 填充，因此可以直接放进 URL 或文件名，JWT 就使用这种格式。解码时两种格式都会自动识别。"
      - q: "输入的内容会发送到服务器吗？"
        a: "不会。编码和解码都由浏览器中的 JavaScript 完成。最近记录也只保存在此浏览器的 localStorage 中，可以随时清空。"

url:
  ko:
    nav: "URL 인코딩·디코딩"
    encoded: "URL 인코딩 결과"
    plain_ph: "여기에 텍스트나 URL 을 입력하면 오른쪽에 인코딩 결과가 나옵니다"
    encoded_ph: "여기에 %ED%95%9C%EA%B8%80 같은 값을 붙여 넣으면 왼쪽에 원문이 나옵니다"
    opt_component: "값 하나 인코딩 (encodeURIComponent)"
    opt_uri: "URL 전체 인코딩 (encodeURI)"
    opt_plus: "공백을 + 로 (폼 방식)"
    err_encode: "인코딩할 수 없는 문자가 들어 있습니다 (짝이 맞지 않는 서로게이트 문자)."
    err_decode: "잘못된 % 시퀀스가 있어 그 부분은 그대로 두고 나머지만 디코딩했습니다."
    sample: "https://example.com/검색?q=한글 테스트&lang=ko"
    about_title: "URL 인코딩(퍼센트 인코딩)이란"
    about:
      - "URL 에는 영문자·숫자와 몇몇 기호만 그대로 쓸 수 있습니다. 한글이나 공백, &, =, ? 같은 문자는 UTF-8 바이트로 바꾼 뒤 각 바이트를 %XX 형태로 적는데, 이것을 URL 인코딩 또는 퍼센트 인코딩이라고 합니다. 예를 들어 한글 '가' 는 %EA%B0%80 이 됩니다."
      - "쿼리 문자열의 값 하나를 넣을 때는 & 와 = 까지 바꾸는 encodeURIComponent 방식을, 주소 전체를 한 번에 바꿀 때는 : / ? & = 같은 구분 기호를 남겨 두는 encodeURI 방식을 고르면 됩니다."
      - "모든 변환은 브라우저 안에서만 이루어집니다. 입력한 주소와 값은 서버로 전송되지 않습니다."
    faq:
      - q: "encodeURI 와 encodeURIComponent 는 무엇이 다른가요?"
        a: "encodeURI 는 주소 전체를 대상으로 하므로 : / ? # & = 같은 구분 기호를 그대로 둡니다. encodeURIComponent 는 쿼리 값 하나를 대상으로 하므로 이 기호들까지 모두 %XX 로 바꿉니다. 파라미터 값을 만들 때는 encodeURIComponent 가 안전합니다."
      - q: "공백은 %20 과 + 중 무엇이 맞나요?"
        a: "둘 다 쓰입니다. URL 경로와 일반적인 퍼센트 인코딩에서는 %20 을 쓰고, HTML 폼이 보내는 application/x-www-form-urlencoded 형식에서는 + 를 씁니다. '공백을 + 로' 옵션을 켜면 폼 방식으로 인코딩하고 디코딩합니다."
      - q: "한글 URL 이 %EC%95%88 처럼 길게 바뀌는 이유는 무엇인가요?"
        a: "한글 한 글자는 UTF-8 에서 3바이트이고, 각 바이트가 %XX 세 글자로 적히기 때문입니다. 그래서 한글 한 글자가 아홉 글자가 됩니다. 디코딩하면 원래 한글로 돌아옵니다."
      - q: "입력한 URL 이 서버로 전송되나요?"
        a: "전송되지 않습니다. 인코딩과 디코딩은 모두 브라우저의 자바스크립트로 처리합니다."
  en:
    nav: "URL Encode & Decode"
    encoded: "URL-encoded"
    plain_ph: "Type text or a URL here and the encoded form appears on the right"
    encoded_ph: "Paste something like caf%C3%A9%20menu here and the original appears on the left"
    opt_component: "Encode a single value (encodeURIComponent)"
    opt_uri: "Encode a whole URL (encodeURI)"
    opt_plus: "Spaces as + (form style)"
    err_encode: "The text contains a character that cannot be encoded (an unpaired surrogate)."
    err_decode: "Some % sequences are malformed. They were left as they are and the rest was decoded."
    sample: "https://example.com/search?q=café menu&lang=en"
    about_title: "What is URL encoding (percent-encoding)?"
    about:
      - "A URL may only contain letters, digits and a few symbols as they are. Anything else, such as spaces, non-ASCII letters, &, = or ?, is converted to UTF-8 bytes and each byte is written as %XX. This is called URL encoding or percent-encoding. For example, é becomes %C3%A9 and a space becomes %20."
      - "Use the encodeURIComponent mode for one query-string value, since it also escapes & and =. Use the encodeURI mode for a complete address, since it keeps separators such as : / ? & = intact."
      - "Everything runs in your browser. The URLs and values you type are not sent to a server."
    faq:
      - q: "What is the difference between encodeURI and encodeURIComponent?"
        a: "encodeURI is meant for a whole address, so it leaves separators such as : / ? # & = alone. encodeURIComponent is meant for a single query value, so it escapes those separators as well. For building a parameter value, encodeURIComponent is the safe choice."
      - q: "Should a space be %20 or +?"
        a: "Both exist. URL paths and plain percent-encoding use %20, while HTML forms sent as application/x-www-form-urlencoded use +. Turn on the 'Spaces as +' option to encode and decode the form style."
      - q: "Why does one non-English character turn into several %XX groups?"
        a: "Because the character is first converted to UTF-8, where it takes two to four bytes, and every byte is written as its own %XX group. Decoding restores the original character."
      - q: "Is the URL I enter sent to a server?"
        a: "No. Encoding and decoding happen in JavaScript in your browser."
  ja:
    nav: "URL エンコード・デコード"
    encoded: "URL エンコード結果"
    plain_ph: "ここにテキストや URL を入力すると、右側にエンコード結果が表示されます"
    encoded_ph: "ここに %E6%97%A5%E6%9C%AC のような値を貼り付けると、左側に元のテキストが表示されます"
    opt_component: "値を 1 つエンコード (encodeURIComponent)"
    opt_uri: "URL 全体をエンコード (encodeURI)"
    opt_plus: "空白を + に（フォーム方式）"
    err_encode: "エンコードできない文字が含まれています（対になっていないサロゲート文字）。"
    err_decode: "不正な % シーケンスがあります。その部分はそのまま残し、残りだけデコードしました。"
    sample: "https://example.com/検索?q=日本語 テスト&lang=ja"
    about_title: "URL エンコード（パーセントエンコーディング）とは"
    about:
      - "URL にそのまま書けるのは、英数字と一部の記号だけです。日本語や空白、&、=、? などの文字は UTF-8 のバイト列に変換し、各バイトを %XX の形で書きます。これを URL エンコード、またはパーセントエンコーディングと呼びます。たとえば「あ」は %E3%81%82 になります。"
      - "クエリ文字列の値を 1 つ入れるときは & や = も変換する encodeURIComponent 方式を、アドレス全体をまとめて変換するときは : / ? & = などの区切り記号を残す encodeURI 方式を選びます。"
      - "変換はすべてブラウザ内で行われます。入力した URL や値がサーバーに送信されることはありません。"
    faq:
      - q: "encodeURI と encodeURIComponent の違いは何ですか？"
        a: "encodeURI はアドレス全体を対象にするため、: / ? # & = などの区切り記号をそのまま残します。encodeURIComponent はクエリの値 1 つを対象にするため、これらの記号もすべて %XX に変換します。パラメーターの値を作るときは encodeURIComponent が安全です。"
      - q: "空白は %20 と + のどちらが正しいですか？"
        a: "どちらも使われます。URL のパスや通常のパーセントエンコーディングでは %20 を、HTML フォームが送信する application/x-www-form-urlencoded 形式では + を使います。「空白を + に」オプションを有効にすると、フォーム方式でエンコード・デコードします。"
      - q: "日本語の URL が %E6%97%A5 のように長くなるのはなぜですか？"
        a: "日本語の 1 文字は UTF-8 で 3 バイトになり、各バイトが %XX の 3 文字で書かれるためです。そのため 1 文字が 9 文字になります。デコードすると元の日本語に戻ります。"
      - q: "入力した URL はサーバーに送信されますか？"
        a: "送信されません。エンコードもデコードもブラウザの JavaScript で処理します。"
  zh:
    nav: "URL 编码解码"
    encoded: "URL 编码结果"
    plain_ph: "在这里输入文本或 URL，右侧会显示编码结果"
    encoded_ph: "在这里粘贴 %E4%B8%AD%E6%96%87 这样的内容，左侧会显示原始文本"
    opt_component: "编码单个值 (encodeURIComponent)"
    opt_uri: "编码整个 URL (encodeURI)"
    opt_plus: "空格转为 +（表单方式）"
    err_encode: "文本中包含无法编码的字符（不成对的代理字符）。"
    err_decode: "存在格式错误的 % 序列。这些部分保持原样，其余部分已解码。"
    sample: "https://example.com/搜索?q=中文 测试&lang=zh"
    about_title: "什么是 URL 编码（百分号编码）"
    about:
      - "URL 中只有英文字母、数字和少数符号可以直接使用。中文、空格以及 &、=、? 等字符需要先转换为 UTF-8 字节，再把每个字节写成 %XX 的形式，这就是 URL 编码，也叫百分号编码。例如“中”会变成 %E4%B8%AD。"
      - "要放入查询字符串的单个值时，选择会同时转义 & 和 = 的 encodeURIComponent 方式；要一次转换整个地址时，选择保留 : / ? & = 等分隔符的 encodeURI 方式。"
      - "所有转换都在浏览器内完成，输入的地址和值不会发送到服务器。"
    faq:
      - q: "encodeURI 和 encodeURIComponent 有什么区别？"
        a: "encodeURI 针对整个地址，所以会保留 : / ? # & = 等分隔符。encodeURIComponent 针对单个查询值，所以连这些符号也会转成 %XX。生成参数值时使用 encodeURIComponent 更安全。"
      - q: "空格应该是 %20 还是 +？"
        a: "两种都在使用。URL 路径和普通的百分号编码使用 %20，而 HTML 表单以 application/x-www-form-urlencoded 格式提交时使用 +。打开“空格转为 +”选项后，会按表单方式编码和解码。"
      - q: "为什么中文 URL 会变成 %E4%B8%AD 这样很长的内容？"
        a: "因为一个汉字在 UTF-8 中占 3 个字节，每个字节又写成 %XX 三个字符，所以一个汉字会变成九个字符。解码后会还原为原来的中文。"
      - q: "输入的 URL 会发送到服务器吗？"
        a: "不会。编码和解码都由浏览器中的 JavaScript 完成。"
